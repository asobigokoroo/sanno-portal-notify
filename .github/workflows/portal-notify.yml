      - name: Run notifier
        env:
          SANNO_ID: ${{ secrets.SANNO_ID }}
          SANNO_PASS: ${{ secrets.SANNO_PASS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEBUG: "1"
        run: python portal_notify.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_*.png
            debug_*.html
          retention-days: 3
