name: SANNOポータル通知

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Discord test notification"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run script
        env:
          SANNO_ID: ${{ secrets.SANNO_ID }}
          SANNO_PASS: ${{ secrets.SANNO_PASS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_DISCORD: ${{ inputs.send_test || false }}
          DEBUG: "false"
        run: |
          echo "=== ファイル確認 ==="
          ls -la portal_notify.py
          wc -l portal_notify.py
          head -n 5 portal_notify.py
          echo "=== 実行開始 ==="
          python portal_notify.py

      - name: Commit and push seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen.json [skip ci]"
          git push

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_*.html
            debug_*.png
            seen.json
          if-no-files-found: ignore
          retention-days: 7
