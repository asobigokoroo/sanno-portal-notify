# .github/workflows/portal-notify.yml
# 産能ポータル(CA-in)の新着を定期的にチェックしてDiscordに通知するで。
# GitHubのクラウド上でcron実行されるから、自分のPCは電源OFFでOK。
name: SANNO Portal Notify

on:
  schedule:
    # UTC表記やで（JST-9h）。下のは 8:05 / 12:05 / 18:05 / 22:05 JST に動く例。
    - cron: "5 23 * * *"   # 08:05 JST
    - cron: "5 3 * * *"    # 12:05 JST
    - cron: "5 9 * * *"    # 18:05 JST
    - cron: "5 13 * * *"   # 22:05 JST
  workflow_dispatch: {}     # 手動実行ボタンも付けとく

permissions:
  contents: write          # seen.json をコミットして重複防止するため

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run notifier
        env:
          SANNO_ID: ${{ secrets.SANNO_ID }}
          SANNO_PASS: ${{ secrets.SANNO_PASS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEBUG: "0"
        run: python portal_notify.py

      - name: Commit seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json || true
          git commit -m "chore: update seen.json [skip ci]" || echo "no changes"
          git push || echo "push skipped"
