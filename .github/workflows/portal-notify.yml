name: SANNO Portal Notify

on:
  schedule:
    - cron: "5 23 * * *"   # 08:05 JST
    - cron: "5 3 * * *"    # 12:05 JST
    - cron: "5 9 * * *"    # 18:05 JST
    - cron: "5 13 * * *"   # 22:05 JST
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 通知機能を実行
        env:
          SANNO_ID: ${{ secrets.SANNO_ID }}
          SANNO_PASS: ${{ secrets.SANNO_PASS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEBUG: "1"
        run: python portal_notify.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_*.png
            debug_*.html
          retention-days: 3

      - name: Commit seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json || true
          git commit -m "chore: update seen.json [skip ci]" || echo "no changes"
          git push || echo "push skipped"
