name: SANNOポータル通知

on:
  schedule:
    - cron: "0 * * * *"   # 毎時0分に実行
  workflow_dispatch:       # 手動実行もOK

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run script
        env:
          SANNO_ID: ${{ secrets.SANNO_ID }}
          SANNO_PASS: ${{ secrets.SANNO_PASS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEBUG: "true"
        run: |
          echo "=== ファイル確認 ==="
          ls -la portal_notify.py
          wc -l portal_notify.py
          head -n 5 portal_notify.py
          echo "=== 実行開始 ==="
          python portal_notify.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_*.html
            debug_*.png
            seen.json
          if-no-files-found: ignore
